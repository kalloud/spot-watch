<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Spot Watch · Phase 2</title>
<style>
  :root {
    --bg: #111418; --panel: #1b2027; --line: #2c333d; --text: #e6e9ee; --muted: #8b95a3;
    --ok: #3fb950; --warn: #d29922; --fail: #f85149; --pending: #58a6ff; --idle: #6e7681;
    --mono: ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  main { max-width: 720px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 8px; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .build { color: var(--muted); font: 12px var(--mono); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 10px 0; }
  a { color: var(--pending); word-break: break-all; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  #errors { background: #4a1414; border: 1px solid var(--fail); border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; }
  #errors .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  #errorList { font: 13px/1.4 var(--mono); word-break: break-word; }
  #errorList div + div { margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; }
  #statusTable td, #statusTable th { padding: 4px 6px 4px 0; vertical-align: top; text-align: left; }
  #statusTable th { font-weight: 600; white-space: nowrap; width: 1%; padding-right: 10px; }
  #statusTable td:last-child { word-break: break-word; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--idle); margin-top: 5px; }
  .st-ok .dot { background: var(--ok); }
  .st-warn .dot { background: var(--warn); }
  .st-fail .dot { background: var(--fail); }
  .st-pending .dot { background: var(--pending); }
  .st-fail td:last-child { color: #ffb4ae; }

  .video-wrap { position: relative; background: #000; border-radius: 8px; overflow: hidden; min-height: 160px; margin: 0 auto; }
  .video-wrap.live { min-height: 0; }
  .video-wrap video { display: block; width: 100%; height: auto; }
  .video-wrap canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .video-wrap.drawing { box-shadow: 0 0 0 2px var(--pending); -webkit-user-select: none; -webkit-touch-callout: none; }
  .video-wrap.drawing canvas { pointer-events: auto; touch-action: none; cursor: crosshair; }
  .video-wrap .placeholder { position: absolute; top: 50%; left: 0; right: 0; text-align: center; transform: translateY(-50%); color: var(--muted); }
  .video-wrap.live .placeholder { display: none; }

  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  label.check { display: flex; align-items: center; gap: 8px; min-height: 44px; margin: 0; font-size: 15px; color: var(--text); }
  label.check input { width: 22px; height: 22px; margin: 0; }
  button, select, input[type=text] {
    font: inherit; font-size: 16px; color: var(--text); background: #2b3442;
    border: 1px solid var(--line); border-radius: 8px; min-height: 44px;
  }
  button { padding: 0 14px; }
  button:active { background: #3a4556; }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button.small { min-height: 32px; font-size: 13px; padding: 0 10px; }
  select { padding: 0 8px; }
  input[type=text] { width: 100%; padding: 0 10px; background: #0d1117; font-family: var(--mono); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field + .field { margin-top: 12px; }
  .hint { font-size: 13px; margin-top: 4px; }
  .hint.bad { color: var(--fail); }

  dl.stats { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0; font-size: 14px; }
  dl.stats dt { color: var(--muted); }
  dl.stats dd { margin: 0; font-family: var(--mono); word-break: break-word; }

  #detTable, #spotTable { margin-top: 10px; font-size: 14px; }
  #detTable th, #detTable td, #spotTable th, #spotTable td { text-align: left; padding: 3px 8px 3px 0; border-top: 1px solid var(--line); }
  #detTable th, #spotTable th { color: var(--muted); font-weight: 400; border-top: 0; }
  #detTable td.num { font-family: var(--mono); }
  .spot-occupied { color: var(--fail); font-weight: 600; }
  .spot-vacant { color: var(--ok); font-weight: 600; }
  .spot-unknown { color: var(--muted); }

  #modelView { margin-top: 10px; }
  #modelView canvas { display: block; max-width: 100%; height: auto; margin-top: 4px; border-radius: 6px; background: #000; }

  .settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  #events { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow: auto; -webkit-overflow-scrolling: touch;
            font: 12px/1.5 var(--mono); }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }

  #messages { list-style: none; margin: 8px 0 0; padding: 0; }
  #messages li { border-top: 1px solid var(--line); padding: 6px 0; word-break: break-word; }
  #messages .meta { font: 12px var(--mono); color: var(--muted); }

  #log { margin: 0; max-height: 300px; overflow: auto; -webkit-overflow-scrolling: touch;
         font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; }
  #reportBox, #csvBox { width: 100%; height: 220px; margin-top: 10px; font: 12px var(--mono); color: var(--text);
               background: #0d1117; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
</style>
</head>
<body>
<main>

<div id="errors" hidden>
  <div class="head"><strong>Errors</strong><button id="clearErrors" class="small" type="button">Clear</button></div>
  <div id="errorList"></div>
</div>

<header>
  <h1>Spot Watch · Phase 2</h1>
  <span class="build" id="build"></span>
</header>

<script>
  // Runs before the libraries and the main script, so load failures and
  // syntax errors still reach the screen (the phone has no console).
  var SW_BUILD = 'phase2 · 2026-11-02 · 4';
  var SW_errors = [];
  document.getElementById('build').textContent = SW_BUILD;

  function SW_showError(msg) {
    var d = new Date();
    var time = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2);
    SW_errors.push({ time: time, msg: msg });
    var line = document.createElement('div');
    line.textContent = time + '  ' + msg;
    document.getElementById('errorList').appendChild(line);
    document.getElementById('errors').hidden = false;
    if (window.SW_onError) window.SW_onError(msg);
  }

  window.onerror = function (message, source, line, col) {
    var where = source ? ' (' + String(source).split('/').pop() + ':' + line + ':' + col + ')' : '';
    SW_showError(String(message) + where);
  };

  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    SW_showError('Unhandled rejection: ' + (r && r.message ? (r.name ? r.name + ': ' : '') + r.message : String(r)));
  });

  function SW_libFail(name) {
    SW_showError('Could not load ' + name + ' from jsDelivr. Check the network, then reload.');
  }

  document.getElementById('clearErrors').onclick = function () {
    document.getElementById('errorList').textContent = '';
    document.getElementById('errors').hidden = true;
  };
</script>

<section>
  <h2>Status</h2>
  <table id="statusTable"><tbody id="status"></tbody></table>
</section>

<section>
  <h2>Camera</h2>
  <div class="video-wrap" id="videoWrap">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div class="placeholder">Camera off</div>
  </div>
  <div class="row">
    <button id="startCamera" class="primary" type="button">Start camera</button>
    <button id="pause" type="button" disabled>Pause detection</button>
    <select id="backend" aria-label="TF.js backend">
      <option value="webgl">WebGL</option>
      <option value="cpu">CPU</option>
    </select>
    <select id="model" aria-label="Detection model">
      <option value="coco-ssd">COCO-SSD lite</option>
      <option value="yolov8n">YOLOv8n 640</option>
    </select>
  </div>
  <div class="row">
    <button id="draw1" type="button" disabled>Draw spot 1</button>
    <button id="draw2" type="button" disabled>Draw spot 2</button>
    <button id="draw3" type="button" disabled>Draw spot 3</button>
    <button id="drawCancel" type="button" hidden>Cancel</button>
    <label class="check"><input type="checkbox" id="debugBoxes"> Debug boxes</label>
  </div>
  <div class="row">
    <select id="fps" aria-label="Camera frame rate">
      <option value="30">30 fps</option>
      <option value="15">15 fps</option>
      <option value="10">10 fps</option>
      <option value="5">5 fps</option>
    </select>
    <select id="aspect" aria-label="Camera frame shape">
      <option value="16:9">16:9</option>
      <option value="4:3">4:3 (taller)</option>
    </select>
    <label class="check"><input type="checkbox" id="nightBoost"> Night boost</label>
  </div>
  <div class="hint muted" id="drawHint"></div>
  <div id="modelView" hidden><div class="hint muted">What the model sees (debug)</div></div>
  <table id="spotTable">
    <thead><tr><th>Spot</th><th>State</th><th>Coverage</th><th>Person</th><th>Next change</th></tr></thead>
    <tbody id="spotRows"></tbody>
  </table>
</section>

<section>
  <h2>Checks</h2>
  <dl class="stats" id="stats"></dl>
  <table id="detTable">
    <thead><tr><th>Class</th><th>Score</th><th>Box x, y, w, h (video px)</th></tr></thead>
    <tbody id="detections"><tr><td colspan="3" class="muted">No check yet</td></tr></tbody>
  </table>
</section>

<section>
  <h2>Events</h2>
  <ul id="events"></ul>
  <div class="row">
    <button id="exportCsv" class="primary" type="button">Export CSV</button>
    <button id="showCsv" type="button">Show CSV</button>
  </div>
  <div class="hint muted" id="exportResult"></div>
  <textarea id="csvBox" readonly hidden></textarea>
</section>

<section>
  <h2>Settings</h2>
  <div class="settings" id="settings"></div>
</section>

<section>
  <h2>Alert topic</h2>
  <div class="field">
    <label for="alertTopic">Subscribe to this topic in the ntfy app on your main phone</label>
    <input type="text" id="alertTopic" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="hint" id="alertHint"></div>
  </div>
  <div class="row">
    <select id="priority" aria-label="Test alert priority">
      <option value="5">Priority 5 (max)</option>
      <option value="4">Priority 4</option>
      <option value="3">Priority 3 (default)</option>
      <option value="2">Priority 2</option>
      <option value="1">Priority 1 (min)</option>
    </select>
    <button id="testAlert" class="primary" type="button">Test alert</button>
  </div>
  <div class="hint muted" id="publishResult"></div>
</section>

<section>
  <h2>Control topic</h2>
  <div class="field">
    <label for="controlTopic">Messages sent to this topic show up below</label>
    <input type="text" id="controlTopic" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="hint" id="controlHint"></div>
  </div>
  <div class="hint muted" id="subscribeInfo"></div>
  <ul id="messages"></ul>
</section>

<section>
  <h2>Log (newest first)</h2>
  <pre id="log"></pre>
  <div class="row">
    <button id="copyReport" type="button">Copy report</button>
    <span class="small muted" id="copyResult"></span>
  </div>
  <textarea id="reportBox" readonly hidden></textarea>
</section>

</main>

<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js" onerror="SW_libFail('TF.js 4.22.0')"></script>
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js" onerror="SW_libFail('COCO-SSD 2.2.3')"></script>

<script>
(function () {
  'use strict';

  const NTFY = 'https://ntfy.sh';
  const SPOT_COUNT = 3;
  const MAX_BOXES = 20;
  const MODELS = { 'coco-ssd': 'COCO-SSD lite', 'yolov8n': 'YOLOv8n 640' };
  // YOLOv8n (Ultralytics, GPL-3.0): a TF.js export with a fixed 640×640 input,
  // served by jsDelivr from a GitHub repo and pinned to one commit.
  const YOLO_URL = 'https://cdn.jsdelivr.net/gh/Hyuto/yolov8-tfjs@b6a8bc691c0c1897802373d7da65dc889af1f451/public/yolov8n_web_model/model.json';
  const YOLO_INPUT = 640;
  const YOLO_IOU = 0.45;          // non-max suppression merges boxes that overlap more than this
  const COCO_CLASSES = ('person,bicycle,car,motorcycle,airplane,bus,train,truck,boat,traffic light,' +
    'fire hydrant,stop sign,parking meter,bench,bird,cat,dog,horse,sheep,cow,elephant,bear,zebra,' +
    'giraffe,backpack,umbrella,handbag,tie,suitcase,frisbee,skis,snowboard,sports ball,kite,' +
    'baseball bat,baseball glove,skateboard,surfboard,tennis racket,bottle,wine glass,cup,fork,' +
    'knife,spoon,bowl,banana,apple,sandwich,orange,broccoli,carrot,hot dog,pizza,donut,cake,chair,' +
    'couch,potted plant,bed,dining table,toilet,tv,laptop,mouse,remote,keyboard,cell phone,' +
    'microwave,oven,toaster,sink,refrigerator,book,clock,vase,scissors,teddy bear,hair drier,' +
    'toothbrush').split(',');
  const HEARTBEAT_MS = 100;       // main-thread load timer, see mainThreadLoad()
  const MOSAIC_PX = 640;          // detector input: one view, or a grid of views (2×2 for up to four)
  const CROP_MARGIN = 0.5;        // margin around each spot's view, as a share of the spot's size
  const CROP_MIN_MARGIN = 0.05;   // ...but at least this share of the frame
  const DUPLICATE_IOU = 0.5;      // the same object seen in two neighbouring views is kept once
  const HOLD_FACTOR = 0.5;        // an occupied spot stays occupied down to this share of occThresh
  const ASPECTS = { '16:9': [1280, 720], '4:3': [1280, 960] };   // camera frame sizes asked for
  const EVENT_LOG_MAX = 20000;    // oldest rows are dropped first
  const EVENTS_SHOWN = 50;
  const FRAME_RATES = [30, 15, 10, 5]; // lower rates may let iOS expose each frame longer at night
  const BOOST_FRAMES = 4;         // frames Night boost averages per check
  const BOOST_MAX_GAIN = 6;       // cap on Night boost's levels stretch, so noise isn't blown up without limit
  const LOW_LIGHT = 45;           // mean brightness (0–255) below which the scene counts as low light
  const NORMAL_LIGHT = 60;        // ...and above which it counts as normal again
  // Tuning settings from PLAN.md, editable on the page and saved in localStorage.
  // `interval` is start-to-start; a check never overlaps the previous one.
  const SETTINGS = [
    { key: 'interval', label: 'Interval (ms)', def: 1500, min: 500, max: 10000, int: true },
    { key: 'minScore', label: 'minScore', def: 0.35, min: 0.1, max: 0.9 },
    { key: 'occThresh', label: 'occThresh', def: 0.35, min: 0.05, max: 0.95 },
    { key: 'confirmN', label: 'confirmN', def: 3, min: 1, max: 20, int: true },
    { key: 'hintN', label: 'hintN', def: 2, min: 1, max: 20, int: true },
    { key: 'personMargin', label: 'Person margin', def: 0.35, min: 0, max: 2 }
  ];
  const LOG_MAX = 50;
  const MESSAGES_MAX = 20;
  const PUBLISH_TIMEOUT_MS = 15000;
  const VEHICLES = ['car', 'truck', 'bus', 'motorcycle'];
  const COLORS = { vehicle: '#ff9f1c', person: '#2ec4f1', other: '#9aa4b2', crop: '#58a6ff' };
  const SPOT_COLORS = { unknown: '#d0d7de', occupied: '#f85149', vacant: '#3fb950' };
  const MIN_SPOT_SIDE = 0.02;     // a drawn box narrower or shorter than 2% of the frame is a stray tap
  const VIDEO_MAX_HEIGHT = 0.85;  // share of the window height the video may use, so a spot fits on screen
  const TOPIC_RE = /^[-_A-Za-z0-9]{1,64}$/;
  const STAGES = [
    ['https', 'HTTPS'],
    ['camera', 'Camera'],
    ['spots', 'Spots'],
    ['backend', 'Backend'],
    ['model', 'Model'],
    ['check', 'Checks'],
    ['events', 'Event log'],
    ['publish', 'Test alert'],
    ['subscribe', 'Control topic']
  ];

  const $ = (id) => document.getElementById(id);
  const video = $('video');
  const overlay = $('overlay');
  const octx = overlay.getContext('2d');
  const frame = document.createElement('canvas');   // the model's input, shown under the video in debug mode
  const fctx = frame.getContext('2d');
  const luma = document.createElement('canvas');    // small copy of the crop for the brightness reading
  const lctx = luma.getContext('2d');
  const stack = document.createElement('canvas');   // where Night boost grabs its frames, off screen
  const sctx = stack.getContext('2d');
  const tileCanvas = document.createElement('canvas');  // one view at a time, for COCO-SSD
  const tctx = tileCanvas.getContext('2d');

  // ---------- small helpers ----------

  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function clock(d) {
    d = d || new Date();
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }
  function fmtMs(ms) {
    if (ms == null || !isFinite(ms)) return '–';
    return ms >= 10000 ? (ms / 1000).toFixed(1) + ' s' : Math.round(ms) + ' ms';
  }
  function errText(e) {
    if (!e) return 'Unknown error';
    if (e.name && e.message) return e.name + ': ' + e.message;
    return e.message || String(e);
  }
  function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }
  function platform() {
    const ios = navigator.userAgent.match(/OS (\d+)_(\d+)(?:_(\d+))? like Mac OS X/);
    const safari = navigator.userAgent.match(/Version\/([\d.]+)/);
    return (ios ? 'iOS ' + ios[1] + '.' + ios[2] + (ios[3] ? '.' + ios[3] : '') : 'not iOS') +
      ' · Safari ' + (safari ? safari[1] : 'unknown');
  }

  // ---------- storage ----------

  let storageOk = true;
  function load(key, fallback) {
    try {
      const v = localStorage.getItem('sw.' + key);
      return v === null ? fallback : v;
    } catch (e) {
      storageOk = false;
      return fallback;
    }
  }
  function save(key, value) {
    try {
      localStorage.setItem('sw.' + key, value);
    } catch (e) {
      storageOk = false;
      log('storage', 'Could not save ' + key + ': ' + errText(e));
    }
  }

  // ---------- on-screen log ----------

  const logEntries = [];
  function log(stage, msg) {
    const last = logEntries[logEntries.length - 1];
    if (last && last.stage === stage && last.msg === msg) {
      last.count++;
      last.time = clock();
    } else {
      logEntries.push({ time: clock(), stage: stage, msg: msg, count: 1 });
      if (logEntries.length > LOG_MAX) logEntries.shift();
    }
    $('log').textContent = logEntries.slice().reverse().map(logLine).join('\n');
  }
  function logLine(e) {
    return e.time + ' [' + e.stage + '] ' + e.msg + (e.count > 1 ? ' (×' + e.count + ')' : '');
  }
  window.SW_onError = (msg) => log('error', msg);
  window.SW_errors.forEach((e) => log('error', e.msg));

  // ---------- settings ----------

  const cfg = {};

  function parseSetting(s, raw) {
    if (raw === null || raw === undefined) return null;
    const text = String(raw).trim().replace(',', '.');
    if (text === '') return null;
    const v = Number(text);
    if (!isFinite(v) || v < s.min || v > s.max) return null;
    return s.int ? Math.round(v) : v;
  }
  function settingHint(s) { return s.min + '–' + s.max + ' · default ' + s.def; }

  SETTINGS.forEach((s) => {
    const raw = load('cfg.' + s.key, null);
    const v = parseSetting(s, raw);
    if (raw !== null && v === null) log('settings', 'Saved ' + s.label + ' is invalid, using the default');
    cfg[s.key] = v === null ? s.def : v;
  });

  // Text inputs with a numeric keypad: a type=number input can reject the
  // decimal comma the keypad shows in some regions.
  SETTINGS.forEach((s) => {
    const field = document.createElement('div');
    const label = document.createElement('label');
    const input = document.createElement('input');
    const hint = document.createElement('div');
    label.htmlFor = 'cfg-' + s.key;
    label.textContent = s.label;
    input.type = 'text';
    input.id = 'cfg-' + s.key;
    input.setAttribute('inputmode', s.int ? 'numeric' : 'decimal');
    input.setAttribute('autocomplete', 'off');
    input.value = String(cfg[s.key]);
    hint.className = 'hint muted';
    hint.textContent = settingHint(s);
    input.addEventListener('change', () => {
      const v = parseSetting(s, input.value);
      if (v === null) {
        hint.className = 'hint bad';
        hint.textContent = 'Use ' + s.min + '–' + s.max + '. Still using ' + cfg[s.key] + '.';
        return;
      }
      hint.className = 'hint muted';
      hint.textContent = settingHint(s);
      input.value = String(v);
      if (v === cfg[s.key]) return;
      cfg[s.key] = v;
      save('cfg.' + s.key, String(v));
      log('settings', s.label + ' = ' + v);
      renderSpotTable();
    });
    field.appendChild(label);
    field.appendChild(input);
    field.appendChild(hint);
    $('settings').appendChild(field);
  });

  // ---------- status rows ----------

  const statusEls = {};
  STAGES.forEach(([key, label]) => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><span class="dot"></span></td><th></th><td></td>';
    tr.children[1].textContent = label;
    $('status').appendChild(tr);
    statusEls[key] = { row: tr, text: tr.children[2], state: 'idle', detail: '' };
  });
  function setStatus(key, state, detail) {
    const s = statusEls[key];
    s.state = state;
    s.detail = detail || '';
    s.row.className = 'st-' + state;
    s.text.textContent = s.detail;
  }

  setStatus('https', window.isSecureContext ? 'ok' : 'fail',
    window.isSecureContext ? location.protocol.replace(':', '') + ' · ' + platform()
                           : 'Not a secure page: the camera is blocked. Open the GitHub Pages https:// URL.');
  setStatus('camera', 'idle', 'Tap Start camera');
  setStatus('check', 'idle', 'Waits for camera and model');
  setStatus('publish', 'idle', 'Not sent yet');

  // ---------- event log ----------

  // Rows are [isoTime, spot, event, coveragePct, hunting]: spot is 1-based or
  // '' for whole-page rows, coverage is '' when it doesn't apply, and hunting
  // stays 0 until Phase 3 adds hunting mode. One localStorage key holds them all.
  let eventRows = [];
  let eventLogOk = true;
  let lastEventWrite = null;
  let csvUrl = null;

  function stamp(d) {
    return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + clock(d);
  }

  function loadEventLog() {
    const raw = load('events', null);
    if (!raw) return;
    try {
      const rows = JSON.parse(raw);
      if (!Array.isArray(rows)) throw new Error('not a list');
      eventRows = rows.filter((r) => Array.isArray(r) && r.length === 5);
    } catch (e) {
      save('events.unreadable', raw);
      log('events', 'Saved event log unreadable (' + errText(e) + '); kept a copy and started a new one');
    }
  }

  function writeEventLog() {
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        localStorage.setItem('sw.events', JSON.stringify(eventRows));
        eventLogOk = true;
        lastEventWrite = new Date();
        return;
      } catch (e) {
        const full = e && (e.name === 'QuotaExceededError' || e.code === 22);
        if (!full || !eventRows.length) {
          eventLogOk = false;
          SW_showError('Event log not saved: ' + errText(e));
          return;
        }
        // Storage full: drop the oldest 10% and try again.
        const drop = Math.max(1, Math.ceil(eventRows.length / 10));
        eventRows.splice(0, drop);
        log('events', 'Storage full, dropped the oldest ' + drop + ' rows');
      }
    }
    eventLogOk = false;
    SW_showError('Event log not saved: storage is still full after dropping old rows.');
  }

  function logEvent(spot, event, coverage) {
    eventRows.push([new Date().toISOString(), spot === null ? '' : spot + 1, event,
      coverage === null ? '' : Math.round(coverage * 100), 0]);
    if (eventRows.length > EVENT_LOG_MAX) eventRows.splice(0, eventRows.length - EVENT_LOG_MAX);
    writeEventLog();
    log('event', eventText(eventRows[eventRows.length - 1]));
    renderEvents();
  }

  function eventText(r) {
    return (r[1] !== '' ? 'Spot ' + r[1] + ' ' : '') + r[2] + (r[3] !== '' ? ' · ' + r[3] + '%' : '');
  }

  function renderEvents() {
    const ul = $('events');
    ul.textContent = '';
    eventRows.slice(-EVENTS_SHOWN).reverse().forEach((r) => {
      const li = document.createElement('li');
      li.textContent = stamp(new Date(r[0])) + '  ' + eventText(r);
      ul.appendChild(li);
    });
    if (!eventRows.length) ul.innerHTML = '<li class="muted">No events yet</li>';
    const detail = eventRows.length + ' rows' + (lastEventWrite ? ' · last write ' + clock(lastEventWrite) : '');
    setStatus('events', !eventLogOk ? 'fail' : eventRows.length ? 'ok' : 'idle', eventLogOk ? detail : detail + ' · not saving');
  }

  function eventCsv() {
    return ['time,spot,event,coverage_pct,hunting'].concat(eventRows.map((r) => r.join(','))).join('\n') + '\n';
  }

  function csvName() {
    const d = new Date();
    return 'spotwatch-log-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
      '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.csv';
  }

  // iOS gives no signal when a download is ignored, so Show CSV is always there as a fallback.
  $('exportCsv').addEventListener('click', () => {
    const name = csvName();
    try {
      if (csvUrl) URL.revokeObjectURL(csvUrl);
      csvUrl = URL.createObjectURL(new Blob([eventCsv()], { type: 'text/csv' }));
      const a = document.createElement('a');
      a.href = csvUrl;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      $('exportResult').textContent = clock() + ': downloading ' + name + ' (' + eventRows.length + ' rows). If nothing happens, tap Show CSV.';
      log('events', 'Exported ' + eventRows.length + ' rows as ' + name);
    } catch (e) {
      $('exportResult').textContent = 'Download failed (' + errText(e) + '). Tap Show CSV and copy it instead.';
      log('events', 'Export failed: ' + errText(e));
    }
  });

  $('showCsv').addEventListener('click', () => {
    const box = $('csvBox');
    box.value = eventCsv();
    box.hidden = false;
    box.focus();
    box.setSelectionRange(0, box.value.length);
    $('exportResult').textContent = eventRows.length + ' rows shown below. Select all and copy.';
  });

  loadEventLog();
  renderEvents();

  // ---------- topics ----------

  function randomTopic(prefix) {
    const chars = 'abcdefghijkmnpqrstuvwxyz23456789'; // 32 chars, so bytes % 32 is unbiased
    const bytes = new Uint8Array(10);
    crypto.getRandomValues(bytes);
    let s = '';
    for (let i = 0; i < bytes.length; i++) s += chars[bytes[i] % chars.length];
    return prefix + s;
  }

  function loadTopic(key) {
    const v = load(key, null);
    return v && TOPIC_RE.test(v) ? v : null;
  }
  const topics = {
    alert: loadTopic('alertTopic'),
    control: loadTopic('controlTopic')
  };
  if (!topics.alert) { topics.alert = randomTopic('spotwatch-'); save('alertTopic', topics.alert); }
  if (!topics.control) { topics.control = randomTopic('spotwatch-ctl-'); save('controlTopic', topics.control); }

  function topicLink(topic) {
    return 'Web: <a target="_blank" rel="noopener" href="' + NTFY + '/' + topic + '">ntfy.sh/' + topic + '</a>';
  }

  // Saves on `change` (blur or Return), so the control subscription
  // isn't torn down on every keystroke.
  function bindTopic(kind, storageKey, onChange) {
    const input = $(kind + 'Topic');
    const hint = $(kind + 'Hint');
    input.value = topics[kind];
    hint.innerHTML = topicLink(topics[kind]);
    input.addEventListener('change', () => {
      const v = input.value.trim();
      if (!TOPIC_RE.test(v)) {
        hint.className = 'hint bad';
        hint.textContent = 'Use 1–64 letters, digits, - or _. Still using the previous topic.';
        return;
      }
      hint.className = 'hint';
      if (v === topics[kind]) { hint.innerHTML = topicLink(v); return; }
      topics[kind] = v;
      save(storageKey, v);
      hint.innerHTML = topicLink(v);
      log('topics', (kind === 'alert' ? 'Alert' : 'Control') + ' topic changed and saved');
      if (onChange) onChange();
    });
  }

  // ---------- ntfy publish ----------

  // POST with a plain string body (Safari sends text/plain;charset=UTF-8) and
  // options as query params: a CORS "simple" request, so no preflight.
  async function publish(topic, message, opts) {
    const qs = [];
    if (opts.title) qs.push('title=' + encodeURIComponent(opts.title));
    if (opts.priority) qs.push('priority=' + encodeURIComponent(opts.priority));
    if (opts.tags) qs.push('tags=' + encodeURIComponent(opts.tags));
    const url = NTFY + '/' + encodeURIComponent(topic) + (qs.length ? '?' + qs.join('&') : '');
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), PUBLISH_TIMEOUT_MS);
    try {
      const res = await fetch(url, { method: 'POST', body: message, signal: ctrl.signal });
      const body = await res.text();
      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + body.slice(0, 200));
      try { return JSON.parse(body); } catch (e) { return {}; }
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('Timed out after ' + PUBLISH_TIMEOUT_MS / 1000 + ' s');
      if (e.name === 'TypeError') throw new Error('Network or CORS failure (' + e.message + ')');
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  const prioritySel = $('priority');
  prioritySel.value = load('testPriority', '5');
  prioritySel.addEventListener('change', () => save('testPriority', prioritySel.value));

  $('testAlert').addEventListener('click', async () => {
    const btn = $('testAlert');
    const priority = prioritySel.value;
    btn.disabled = true;
    setStatus('publish', 'pending', 'Sending (priority ' + priority + ')…');
    const t0 = performance.now();
    try {
      const reply = await publish(topics.alert, 'Test alert from Spot Watch, sent ' + clock() + ' (' + SW_BUILD + ')', {
        title: 'Spot Watch test', priority: priority, tags: 'test_tube'
      });
      const ms = performance.now() - t0;
      const detail = 'Accepted by ntfy in ' + fmtMs(ms) + ' · priority ' + priority + (reply.id ? ' · id ' + reply.id : '');
      setStatus('publish', 'ok', detail);
      $('publishResult').textContent = clock() + ': ' + detail + '. Now check the main phone.';
      log('publish', detail);
    } catch (e) {
      setStatus('publish', 'fail', errText(e));
      $('publishResult').textContent = clock() + ': failed: ' + errText(e);
      log('publish', 'Failed: ' + errText(e));
    } finally {
      btn.disabled = false;
    }
  });

  // ---------- ntfy subscribe (control topic) ----------

  let es = null;
  let reconnects = 0;
  let lastKeepalive = null;
  let retryTimer = 0;
  const messages = [];

  function subscribe() {
    clearTimeout(retryTimer);
    if (es) es.close();
    setStatus('subscribe', 'pending', 'Connecting…');
    const source = new EventSource(NTFY + '/' + encodeURIComponent(topics.control) + '/sse');
    es = source;
    let connected = false;

    // EventSource's own `open` and ntfy's named `open` event share a name;
    // either one means the stream is up.
    source.addEventListener('open', () => {
      if (es !== source || connected) return;
      connected = true;
      setStatus('subscribe', 'ok', 'Connected · waiting for messages');
      log('subscribe', 'Connected');
      renderSubscribeInfo();
    });
    source.addEventListener('keepalive', () => {
      if (es !== source) return;
      lastKeepalive = new Date();
      renderSubscribeInfo();
    });
    source.addEventListener('message', (e) => {
      if (es !== source) return;
      let data;
      try { data = JSON.parse(e.data); } catch (err) { log('subscribe', 'Unparsable event: ' + String(e.data).slice(0, 80)); return; }
      if (data.event && data.event !== 'message') return;
      const now = Date.now();
      const lagS = data.time ? Math.max(0, Math.round(now / 1000 - data.time)) : null;
      messages.unshift({ at: new Date(now), text: data.message || '', title: data.title || '', lagS: lagS });
      if (messages.length > MESSAGES_MAX) messages.pop();
      renderMessages();
      setStatus('subscribe', 'ok', 'Connected · last message ' + clock() + (lagS !== null ? ' · ~' + lagS + ' s after send' : ''));
      log('control', 'Received: "' + (data.message || '').slice(0, 80) + '"' + (lagS !== null ? ' (~' + lagS + ' s after send)' : ''));
    });
    source.addEventListener('error', () => {
      if (es !== source) return;
      connected = false;
      reconnects++;
      renderSubscribeInfo();
      if (source.readyState === EventSource.CLOSED) {
        setStatus('subscribe', 'fail', 'Connection closed · retrying in 5 s');
        log('subscribe', 'Connection closed, retrying in 5 s');
        retryTimer = setTimeout(subscribe, 5000);
      } else {
        setStatus('subscribe', 'warn', 'Connection dropped · reconnecting');
        log('subscribe', 'Connection dropped, browser is reconnecting');
      }
    });
  }

  function renderSubscribeInfo() {
    $('subscribeInfo').textContent = 'Reconnects: ' + reconnects +
      ' · last keepalive: ' + (lastKeepalive ? clock(lastKeepalive) : 'none yet');
  }

  function renderMessages() {
    const ul = $('messages');
    ul.textContent = '';
    messages.forEach((m) => {
      const li = document.createElement('li');
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = clock(m.at) + (m.lagS !== null ? ' · ~' + m.lagS + ' s after send' : '') + (m.title ? ' · ' + m.title : '');
      const text = document.createElement('div');
      text.textContent = m.text;
      li.appendChild(meta);
      li.appendChild(text);
      ul.appendChild(li);
    });
  }

  bindTopic('alert', 'alertTopic', null);
  bindTopic('control', 'controlTopic', () => { messages.length = 0; renderMessages(); subscribe(); });
  renderSubscribeInfo();
  subscribe();

  // ---------- camera ----------

  let stream = null;
  let track = null;
  let fps = Number(load('fps', '30'));
  if (FRAME_RATES.indexOf(fps) === -1) fps = 30;

  let aspect = load('aspect', '16:9');
  if (!ASPECTS[aspect]) aspect = '16:9';

  // 4:3 keeps the sensor's full height, so it shows more above and below than
  // 16:9 at the same width. 30 fps is the camera's default, so it adds no
  // constraint; a lower rate is asked for as a maximum first, then as a
  // preference if that is refused.
  function videoConstraints(withMax) {
    const size = ASPECTS[aspect];
    const v = { facingMode: { ideal: 'environment' }, width: { ideal: size[0] }, height: { ideal: size[1] } };
    if (fps < 30) v.frameRate = withMax ? { ideal: fps, max: fps } : { ideal: fps };
    return v;
  }

  function cameraCapabilities() {
    if (!track || !track.getCapabilities) return null;
    const c = Object.assign({}, track.getCapabilities());
    delete c.deviceId;
    delete c.groupId;
    return c;
  }

  function cameraHint(e) {
    switch (e && e.name) {
      case 'NotAllowedError': return 'Permission denied. Settings → Safari → Camera → Allow (or Ask), then reload.';
      case 'NotFoundError': return 'No camera found.';
      case 'NotReadableError': return 'Camera is busy. Close other apps using it, then try again.';
      case 'OverconstrainedError': return 'Camera rejected the requested settings: ' + (e.constraint || '');
      default: return errText(e);
    }
  }

  function stopCamera() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
    track = null;
  }

  function waitForVideo(timeoutMs) {
    if (video.videoWidth > 0) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('Video did not start within ' + timeoutMs / 1000 + ' s')), timeoutMs);
      video.addEventListener('loadedmetadata', () => { clearTimeout(timer); resolve(); }, { once: true });
    });
  }

  function cameraSettings() {
    if (!track || !track.getSettings) return {};
    const s = track.getSettings();
    return { width: s.width, height: s.height, frameRate: s.frameRate, facingMode: s.facingMode };
  }

  function cameraDetail() {
    const s = cameraSettings();
    return video.videoWidth + '×' + video.videoHeight + ' · ' + frameShape() +
      (s.facingMode ? ' · ' + s.facingMode : '') + (s.frameRate ? ' · ' + Math.round(s.frameRate) + ' fps' : '');
  }

  async function startCamera() {
    if (!window.isSecureContext) {
      setStatus('camera', 'fail', 'Needs https:// (see HTTPS row)');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('camera', 'fail', 'navigator.mediaDevices.getUserMedia is missing in this browser');
      return;
    }
    $('startCamera').disabled = true;
    stopDrawing();
    stopCamera();
    setStatus('camera', 'pending', 'Asking for the camera…');
    try {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: videoConstraints(true) });
      } catch (e) {
        if (!e || e.name !== 'OverconstrainedError' || fps === 30) throw e;
        log('camera', 'Max ' + fps + ' fps refused, asking for it as a preference');
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: videoConstraints(false) });
      }
      track = stream.getVideoTracks()[0];
      const thisTrack = track;
      thisTrack.addEventListener('ended', () => {
        if (track !== thisTrack) return;
        setStatus('camera', 'fail', 'Camera track ended. Tap Restart camera.');
        log('camera', 'Track ended');
        stopDrawing();
      });
      video.muted = true;
      video.playsInline = true;
      video.srcObject = stream;
      await video.play();
      await waitForVideo(10000);
      $('videoWrap').classList.add('live');
      onFrameChange();
      const detail = cameraDetail();
      setStatus('camera', 'ok', detail);
      log('camera', 'Started: ' + detail + (fps < 30 ? ' (asked for ' + fps + ' fps)' : ''));
      log('camera', 'Capabilities: ' + JSON.stringify(cameraCapabilities()));
      logEvent(null, 'start', null);
      $('startCamera').textContent = 'Restart camera';
      $('pause').disabled = false;
      setDrawButtons();
      startLoop();
    } catch (e) {
      setStatus('camera', 'fail', cameraHint(e));
      log('camera', 'Failed: ' + errText(e));
    } finally {
      $('startCamera').disabled = false;
    }
  }

  $('startCamera').addEventListener('click', startCamera);

  const fpsSel = $('fps');
  fpsSel.value = String(fps);
  fpsSel.addEventListener('change', () => {
    fps = Number(fpsSel.value);
    save('fps', String(fps));
    log('camera', 'Frame rate set to ' + fps + ' fps');
    if (stream) startCamera();
  });

  const aspectSel = $('aspect');
  aspectSel.value = aspect;
  aspectSel.addEventListener('change', () => {
    aspect = aspectSel.value;
    save('aspect', aspect);
    log('camera', 'Frame shape set to ' + aspect);
    if (stream) startCamera();
  });

  // ---------- spots ----------

  // Each spot is { x, y, w, h } as fractions (0–1) of the video frame, plus the
  // orientation the frame had when it was drawn. iOS rotates the camera picture
  // with the phone, so a spot only applies while the frame has that orientation.
  let spots = new Array(SPOT_COUNT).fill(null);
  let drawingSpot = -1;           // index of the spot being drawn, -1 when not drawing
  let drag = null;                // { id, x0, y0, x1, y1 } in frame fractions while dragging
  let debugBoxes = load('debugBoxes', '1') === '1';

  // Live state per spot. Reset to `unknown` (without a log row) when the spot is
  // redrawn or the frame orientation changes, so neither can look like a departure.
  function freshTrack() {
    return {
      state: 'unknown', since: null, occRun: 0, vacRun: 0,
      coverage: null, person: false, personRun: 0, clearRun: 0, personVisit: false
    };
  }
  function freshTracks() { return spots.map(() => freshTrack()); }
  let tracks = freshTracks();

  function frameOrientation() {
    return video.videoWidth >= video.videoHeight ? 'landscape' : 'portrait';
  }

  // Orientation plus aspect, e.g. "landscape 16:9". The same fractions point at
  // a different part of the street on another frame shape, so a spot only
  // applies while the shape it was drawn on matches.
  function shapeOf(w, h) {
    const r = Math.max(w, h) / Math.max(1, Math.min(w, h));
    const ratio = Math.abs(r - 16 / 9) < 0.05 ? '16:9' : Math.abs(r - 4 / 3) < 0.05 ? '4:3' : r.toFixed(2);
    return (w >= h ? 'landscape' : 'portrait') + ' ' + ratio;
  }
  function frameShape() { return shapeOf(video.videoWidth, video.videoHeight); }
  // Spots saved before the 4:3 option were all drawn on 16:9 frames.
  function spotShape(s) { return s.shape || s.orient + ' 16:9'; }
  function round4(v) { return Math.round(v * 10000) / 10000; }
  function pct(v) { return Math.round(v * 100) + '%'; }
  function describeSpot(s) {
    return 'x ' + pct(s.x) + ', y ' + pct(s.y) + ', w ' + pct(s.w) + ', h ' + pct(s.h) + ', ' + spotShape(s);
  }

  function validSpot(s) {
    return !!s && ['x', 'y', 'w', 'h'].every((k) => typeof s[k] === 'number' && isFinite(s[k])) &&
      s.x >= 0 && s.y >= 0 && s.w > 0 && s.h > 0 && s.x + s.w <= 1.0001 && s.y + s.h <= 1.0001 &&
      (s.orient === 'landscape' || s.orient === 'portrait') && (s.shape === undefined || typeof s.shape === 'string');
  }

  function loadSpots() {
    const raw = load('spots', null);
    if (!raw) return;
    try {
      const saved = JSON.parse(raw);
      if (!Array.isArray(saved)) throw new Error('not a list');
      spots = spots.map((_, i) => {
        if (saved[i] == null) return null;
        if (validSpot(saved[i])) return saved[i];
        log('spots', 'Saved spot ' + (i + 1) + ' is invalid, ignored');
        return null;
      });
    } catch (e) {
      log('spots', 'Could not read saved spots (' + errText(e) + '), ignored');
    }
  }

  function renderSpotsStatus() {
    const shape = video.videoWidth ? frameShape() : null;
    let hiddenIn = null;
    let active = 0;
    const parts = spots.map((s, i) => {
      if (!s) return 'Spot ' + (i + 1) + ' not set';
      if (shape && spotShape(s) !== shape) {
        hiddenIn = spotShape(s);
        return 'Spot ' + (i + 1) + ' hidden';
      }
      active++;
      return 'Spot ' + (i + 1) + ' set';
    });
    let text = parts.join(' · ');
    if (hiddenIn) text = 'Drawn on a ' + hiddenIn + ' frame, the camera is now ' + shape + '. Rotate back, switch the shape back, or redraw. (' + text + ')';
    if (shape && !active) text += ' · Detecting on the full frame, states paused.';
    setStatus('spots', hiddenIn ? 'warn' : spots.every(Boolean) ? 'ok' : 'idle', text);
  }

  function isActive(s) {
    return !!s && spotShape(s) === frameShape();
  }

  // Where the detector looks, as fractions of the frame: one view per active
  // spot (the spot plus a margin of CROP_MARGIN of its size on each side, at
  // least CROP_MIN_MARGIN of the frame, clipped to the frame), or the whole
  // frame when no spot is active.
  function spotViews() {
    const views = spots.filter(isActive).map((s) => {
      const mx = Math.max(CROP_MARGIN * s.w, CROP_MIN_MARGIN);
      const my = Math.max(CROP_MARGIN * s.h, CROP_MIN_MARGIN);
      const x0 = Math.max(0, s.x - mx), y0 = Math.max(0, s.y - my);
      const x1 = Math.min(1, s.x + s.w + mx), y1 = Math.min(1, s.y + s.h + my);
      return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    });
    return views.length ? views : [{ x: 0, y: 0, w: 1, h: 1 }];
  }

  // Coverage, occupancy and person-near for one spot, worked out in video pixels.
  function readSpot(s, dets) {
    const fw = video.videoWidth, fh = video.videoHeight;
    const sx = s.x * fw, sy = s.y * fh, sw = s.w * fw, sh = s.h * fh;
    const mx = sw * cfg.personMargin, my = sh * cfg.personMargin;
    let coverage = 0;
    let person = false;
    dets.forEach((d) => {
      if (VEHICLES.indexOf(d.class) !== -1) {
        coverage = Math.max(coverage, overlapArea(sx, sy, sw, sh, d.bbox) / (sw * sh));
      } else if (d.class === 'person' && overlapArea(sx - mx, sy - my, sw + 2 * mx, sh + 2 * my, d.bbox) > 0) {
        person = true;
      }
    });
    return { coverage: coverage, person: person };
  }

  function overlapArea(x, y, w, h, b) {
    const ow = Math.min(x + w, b[0] + b[2]) - Math.max(x, b[0]);
    const oh = Math.min(y + h, b[1] + b[3]) - Math.max(y, b[1]);
    return ow > 0 && oh > 0 ? ow * oh : 0;
  }

  // A spot changes state only after `confirmN` readings in a row agree. A
  // reading is occupied at `occThresh` coverage, or, once the spot is occupied,
  // down to HOLD_FACTOR of it, so coverage hovering at the line can't flip it.
  // person_near is logged only while occupied, once per visit: a visit starts
  // after `hintN` readings with a person near and ends after `hintN` without.
  function updateSpot(i, reading) {
    const t = tracks[i];
    t.coverage = reading.coverage;
    t.person = reading.person;
    const threshold = t.state === 'occupied' ? cfg.occThresh * HOLD_FACTOR : cfg.occThresh;
    if (reading.coverage >= threshold) { t.occRun++; t.vacRun = 0; } else { t.vacRun++; t.occRun = 0; }
    const next = t.occRun >= cfg.confirmN ? 'occupied' : t.vacRun >= cfg.confirmN ? 'vacant' : null;
    if (next && next !== t.state) {
      t.state = next;
      t.since = new Date();
      logEvent(i, next, reading.coverage);
    }
    if (reading.person) { t.personRun++; t.clearRun = 0; } else { t.clearRun++; t.personRun = 0; }
    if (!t.personVisit && t.state === 'occupied' && t.personRun >= cfg.hintN) {
      t.personVisit = true;
      logEvent(i, 'person_near', reading.coverage);
    } else if (t.personVisit && t.clearRun >= cfg.hintN) {
      t.personVisit = false;
    }
  }

  // Readings in a row toward a state change, e.g. "vacant 2/3".
  function runText(t) {
    if (t.state !== 'occupied' && t.occRun > 0) return 'occupied ' + Math.min(t.occRun, cfg.confirmN) + '/' + cfg.confirmN;
    if (t.state !== 'vacant' && t.vacRun > 0) return 'vacant ' + Math.min(t.vacRun, cfg.confirmN) + '/' + cfg.confirmN;
    return '–';
  }

  function renderSpotTable() {
    const tbody = $('spotRows');
    tbody.textContent = '';
    const shape = video.videoWidth ? frameShape() : null;
    spots.forEach((s, i) => {
      const t = tracks[i];
      const shown = !!s && (!shape || spotShape(s) === shape);
      const cells = !s ? ['not set', '–', '–', '–']
        : !shown ? ['hidden (drawn on ' + spotShape(s) + ')', '–', '–', '–']
        : [t.state + (t.since ? ' since ' + clock(t.since) : ''),
           t.coverage === null ? '–' : Math.round(t.coverage * 100) + '%',
           t.coverage === null ? '–' : (t.person ? 'yes' : 'no'),
           runText(t)];
      const tr = document.createElement('tr');
      [String(i + 1)].concat(cells).forEach((text, c) => {
        const td = document.createElement('td');
        td.textContent = text;
        if (c === 1 && shown) td.className = 'spot-' + t.state;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  function setDrawButtons() {
    const live = !!(track && track.readyState === 'live' && video.videoWidth > 0);
    spots.forEach((_, i) => { $('draw' + (i + 1)).disabled = !live || drawingSpot >= 0; });
    $('drawCancel').hidden = drawingSpot < 0;
  }

  // While drawing, the overlay takes touches (see .drawing in the CSS);
  // the rest of the time it ignores them so the page scrolls normally.
  function startDrawing(i) {
    drawingSpot = i;
    drag = null;
    $('videoWrap').classList.add('drawing');
    $('drawHint').textContent = 'Drag a box over spot ' + (i + 1) + ' on the video.';
    setDrawButtons();
    drawOverlay();
  }

  function stopDrawing(hint) {
    drawingSpot = -1;
    drag = null;
    $('videoWrap').classList.remove('drawing');
    $('drawHint').textContent = hint || '';
    setDrawButtons();
    drawOverlay();
  }

  function pointToFrac(e) {
    const r = overlay.getBoundingClientRect();
    return {
      x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
      y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))
    };
  }

  function dragRect() {
    return {
      x: Math.min(drag.x0, drag.x1), y: Math.min(drag.y0, drag.y1),
      w: Math.abs(drag.x1 - drag.x0), h: Math.abs(drag.y1 - drag.y0)
    };
  }

  overlay.addEventListener('pointerdown', (e) => {
    if (drawingSpot < 0 || drag) return;
    e.preventDefault();
    try { overlay.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
    const p = pointToFrac(e);
    drag = { id: e.pointerId, x0: p.x, y0: p.y, x1: p.x, y1: p.y };
    drawOverlay();
  });

  overlay.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    e.preventDefault();
    const p = pointToFrac(e);
    drag.x1 = p.x;
    drag.y1 = p.y;
    drawOverlay();
  });

  overlay.addEventListener('pointerup', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const r = dragRect();
    const i = drawingSpot;
    drag = null;
    if (r.w < MIN_SPOT_SIDE || r.h < MIN_SPOT_SIDE) {
      $('drawHint').textContent = 'Too small, not saved. Drag a bigger box over spot ' + (i + 1) + '.';
      log('spots', 'Box for spot ' + (i + 1) + ' too small, ignored');
      drawOverlay();
      return;
    }
    spots[i] = { x: round4(r.x), y: round4(r.y), w: round4(r.w), h: round4(r.h), orient: frameOrientation(), shape: frameShape() };
    tracks[i] = freshTrack();
    save('spots', JSON.stringify(spots));
    log('spots', 'Spot ' + (i + 1) + ' saved: ' + describeSpot(spots[i]));
    stopDrawing('Spot ' + (i + 1) + ' saved.');
    renderSpotsStatus();
    renderSpotTable();
  });

  overlay.addEventListener('pointercancel', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    drag = null;
    $('drawHint').textContent = 'Drag interrupted. Try again.';
    drawOverlay();
  });

  // Backup for iOS: keeps the page still under a drag even if
  // `touch-action: none` is not honoured.
  overlay.addEventListener('touchmove', (e) => {
    if (drawingSpot >= 0) e.preventDefault();
  }, { passive: false });

  spots.forEach((_, i) => $('draw' + (i + 1)).addEventListener('click', () => startDrawing(i)));
  $('drawCancel').addEventListener('click', () => stopDrawing('Cancelled.'));

  const debugToggle = $('debugBoxes');
  $('modelView').appendChild(frame);
  debugToggle.checked = debugBoxes;
  $('modelView').hidden = !debugBoxes;
  debugToggle.addEventListener('change', () => {
    debugBoxes = debugToggle.checked;
    save('debugBoxes', debugBoxes ? '1' : '0');
    $('modelView').hidden = !debugBoxes;
    log('settings', 'Debug boxes ' + (debugBoxes ? 'on' : 'off'));
    drawOverlay();
  });

  let nightBoost = load('nightBoost', '0') === '1';
  const boostToggle = $('nightBoost');
  boostToggle.checked = nightBoost;
  boostToggle.addEventListener('change', () => {
    nightBoost = boostToggle.checked;
    save('nightBoost', nightBoost ? '1' : '0');
    log('settings', 'Night boost ' + (nightBoost ? 'on' : 'off'));
  });

  loadSpots();
  renderSpotsStatus();
  renderSpotTable();

  // ---------- layout ----------

  // Keeps the whole frame on screen so a spot can be drawn without scrolling.
  // Re-fits only when the width or the frame changes, not when Safari's
  // toolbar shows or hides.
  let fitKey = '';
  function fitVideo() {
    if (!video.videoWidth) return;
    const key = window.innerWidth + ':' + video.videoWidth + 'x' + video.videoHeight;
    if (key === fitKey) return;
    fitKey = key;
    const maxH = window.innerHeight * VIDEO_MAX_HEIGHT;
    $('videoWrap').style.maxWidth = Math.floor(maxH * video.videoWidth / video.videoHeight) + 'px';
  }

  let lastShape = null;
  function onFrameChange() {
    if (!video.videoWidth) return;
    const shape = frameShape();
    if (lastShape && shape !== lastShape) {
      log('camera', 'Frame is now ' + video.videoWidth + '×' + video.videoHeight + ' (' + shape + ')');
      tracks = freshTracks();
      lastViews = [];
      if (drag) {
        drag = null;
        $('drawHint').textContent = 'Phone rotated mid-drag. Try again.';
      }
    }
    lastShape = shape;
    if (statusEls.camera.state === 'ok') setStatus('camera', 'ok', cameraDetail());
    fitVideo();
    sizeOverlay();
    renderSpotsStatus();
    renderSpotTable();
  }

  // ---------- overlay ----------

  let lastDets = [];
  let lastViews = [];             // views the detector last ran on (fractions); empty for the full frame

  function colorFor(cls) {
    if (VEHICLES.indexOf(cls) !== -1) return COLORS.vehicle;
    return cls === 'person' ? COLORS.person : COLORS.other;
  }

  function sizeOverlay() {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(video.clientWidth * dpr);
    const h = Math.round(video.clientHeight * dpr);
    if (overlay.width !== w) overlay.width = w;
    if (overlay.height !== h) overlay.height = h;
    drawOverlay();
  }

  function drawOverlay() {
    octx.clearRect(0, 0, overlay.width, overlay.height);
    if (!video.videoWidth || !overlay.width) return;
    const dpr = window.devicePixelRatio || 1;
    const W = overlay.width, H = overlay.height;
    if (debugBoxes && lastViews.length) {
      octx.lineWidth = 1.5 * dpr;
      octx.strokeStyle = COLORS.crop;
      octx.setLineDash([6 * dpr, 4 * dpr]);
      lastViews.forEach((v) => octx.strokeRect(v.x * W, v.y * H, v.w * W, v.h * H));
      octx.setLineDash([]);
    }
    if (debugBoxes) drawDetections(W / video.videoWidth, H / video.videoHeight, dpr);
    spots.forEach((s, i) => {
      if (isActive(s) && !(drag && drawingSpot === i)) drawSpot(s, i, W, H, dpr, tracks[i]);
    });
    if (drag) drawSpot(dragRect(), drawingSpot, W, H, dpr, null);
  }

  // Colored by state: green vacant, red occupied, grey unknown. `st` is null
  // for a box still being drawn, which is dashed grey with no readings.
  function drawSpot(s, i, W, H, dpr, st) {
    const x = s.x * W, y = s.y * H, w = s.w * W, h = s.h * H;
    const color = SPOT_COLORS[st ? st.state : 'unknown'];
    octx.globalAlpha = 0.18;
    octx.fillStyle = color;
    octx.fillRect(x, y, w, h);
    octx.globalAlpha = 1;
    octx.lineWidth = 3 * dpr;
    octx.strokeStyle = color;
    octx.setLineDash(st ? [] : [8 * dpr, 6 * dpr]);
    octx.strokeRect(x, y, w, h);
    octx.setLineDash([]);
    let label = String(i + 1);
    if (st && st.coverage !== null) label += ' · ' + Math.round(st.coverage * 100) + '%';
    if (st && st.person) label += ' · person';
    const tagH = 22 * dpr;
    octx.font = 'bold ' + (14 * dpr) + 'px -apple-system, Helvetica, sans-serif';
    octx.textBaseline = 'middle';
    octx.fillStyle = 'rgba(0, 0, 0, 0.65)';
    octx.fillRect(x, y, octx.measureText(label).width + 10 * dpr, tagH);
    octx.fillStyle = '#fff';
    octx.fillText(label, x + 5 * dpr, y + tagH / 2 + dpr);
  }

  function drawDetections(sx, sy, dpr) {
    const labelH = 16 * dpr;
    octx.lineWidth = 2 * dpr;
    octx.font = (12 * dpr) + 'px -apple-system, Helvetica, sans-serif';
    octx.textBaseline = 'top';
    lastDets.forEach((d) => {
      const x = d.bbox[0] * sx, y = d.bbox[1] * sy, w = d.bbox[2] * sx, h = d.bbox[3] * sy;
      const color = colorFor(d.class);
      octx.strokeStyle = color;
      octx.strokeRect(x, y, w, h);
      const label = d.class + ' ' + Math.round(d.score * 100) + '%';
      const ty = y >= labelH ? y - labelH : y;
      octx.fillStyle = color;
      octx.fillRect(x, ty, octx.measureText(label).width + 6 * dpr, labelH);
      octx.fillStyle = '#000';
      octx.fillText(label, x + 3 * dpr, ty + 2 * dpr);
    });
  }

  if (window.ResizeObserver) new ResizeObserver(sizeOverlay).observe(video);
  window.addEventListener('resize', onFrameChange);
  video.addEventListener('resize', onFrameChange);

  // ---------- TF.js backend + model ----------

  let model = null;
  let backendInfo = null;         // set once a backend is ready; tf.getBackend()/tf.memory() would start one early
  const wantedBackend = load('backend', 'webgl') === 'cpu' ? 'cpu' : 'webgl';
  const backendSel = $('backend');
  backendSel.value = wantedBackend;
  backendSel.addEventListener('change', () => {
    save('backend', backendSel.value);
    location.reload();
  });

  const modelKey = load('model', 'coco-ssd') === 'yolov8n' ? 'yolov8n' : 'coco-ssd';
  const modelSel = $('model');
  modelSel.value = modelKey;
  modelSel.addEventListener('change', () => {
    save('model', modelSel.value);
    location.reload();
  });

  // Wraps the YOLOv8n graph model in COCO-SSD's detect() shape:
  // [{ class, score, bbox: [x, y, w, h] }] in the input canvas's pixels.
  async function loadYolo() {
    const graph = await tf.loadGraphModel(YOLO_URL);
    return { detect: (canvas, maxBoxes, minScore) => detectYolo(graph, canvas, maxBoxes, minScore) };
  }

  // The canvas is padded to a square (bottom and right) and resized to 640×640.
  // The output is [1, 84, 8400]: for each candidate box, its centre x, centre y,
  // width and height in input pixels, then a score for each of the 80 classes.
  async function detectYolo(graph, canvas, maxBoxes, minScore) {
    const w = canvas.width, h = canvas.height, side = Math.max(w, h);
    const [boxes, scores, classes] = tf.tidy(() => {
      const img = tf.browser.fromPixels(canvas).toFloat();
      const square = img.pad([[0, side - h], [0, side - w], [0, 0]]);
      const input = tf.image.resizeBilinear(square, [YOLO_INPUT, YOLO_INPUT]).div(255).expandDims(0);
      const out = graph.execute(input).squeeze([0]).transpose([1, 0]);   // [8400, 84]
      const [cx, cy, bw, bh] = tf.split(out.slice([0, 0], [-1, 4]), 4, 1);
      const cls = out.slice([0, 4], [-1, -1]);
      const corners = tf.concat([cy.sub(bh.div(2)), cx.sub(bw.div(2)), cy.add(bh.div(2)), cx.add(bw.div(2))], 1);
      return [corners, cls.max(1), cls.argMax(1)];
    });
    const keep = await tf.image.nonMaxSuppressionAsync(boxes, scores, maxBoxes, YOLO_IOU, minScore);
    const picked = [boxes.gather(keep), scores.gather(keep), classes.gather(keep)];
    const [b, s, c] = await Promise.all(picked.map((t) => t.array()));
    tf.dispose([boxes, scores, classes, keep].concat(picked));
    const k = side / YOLO_INPUT;    // canvas pixels per input pixel
    return b.map((r, i) => {
      const x1 = Math.max(0, r[1] * k), y1 = Math.max(0, r[0] * k);
      const x2 = Math.min(w, r[3] * k), y2 = Math.min(h, r[2] * k);
      return { class: COCO_CLASSES[c[i]] || 'class ' + c[i], score: s[i], bbox: [x1, y1, x2 - x1, y2 - y1] };
    });
  }

  function backendDetail() {
    const name = tf.getBackend();
    if (name !== 'webgl') return name;
    let s = 'webgl';
    try { s += ' · WebGL ' + tf.env().getNumber('WEBGL_VERSION'); } catch (e) { /* flag missing */ }
    try { s += tf.env().getBool('WEBGL_RENDER_FLOAT32_ENABLED') ? ' · float32' : ' · float16'; } catch (e) { /* flag missing */ }
    return s;
  }

  async function tryBackend(name) {
    try {
      const ok = await tf.setBackend(name);
      if (ok) await tf.ready();
      return ok;
    } catch (e) {
      log('backend', name + ' failed: ' + errText(e));
      return false;
    }
  }

  async function initDetector() {
    if (typeof tf === 'undefined') {
      setStatus('backend', 'fail', 'TF.js did not load (see errors)');
      setStatus('model', 'fail', 'Needs TF.js');
      return;
    }
    setStatus('backend', 'pending', 'Starting ' + wantedBackend + '…');
    let ok = await tryBackend(wantedBackend);
    if (!ok && wantedBackend !== 'cpu') {
      log('backend', 'WebGL did not start, falling back to CPU');
      ok = await tryBackend('cpu');
    }
    if (!ok) {
      setStatus('backend', 'fail', 'No TF.js backend could start');
      setStatus('model', 'fail', 'Needs a backend');
      return;
    }
    const fellBack = tf.getBackend() !== wantedBackend;
    backendInfo = backendDetail();
    setStatus('backend', fellBack ? 'warn' : 'ok', backendInfo + (fellBack ? ' (fallback, ' + wantedBackend + ' failed)' : '') + ' · TF.js ' + tf.version.tfjs);
    log('backend', 'Using ' + backendInfo);
    renderStats();

    if (modelKey === 'coco-ssd' && typeof cocoSsd === 'undefined') {
      setStatus('model', 'fail', 'COCO-SSD did not load (see errors)');
      return;
    }
    setStatus('model', 'pending', 'Downloading ' + MODELS[modelKey] + '…');
    const t0 = performance.now();
    try {
      model = modelKey === 'yolov8n' ? await loadYolo() : await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    } catch (e) {
      setStatus('model', 'fail', errText(e));
      log('model', MODELS[modelKey] + ' load failed: ' + errText(e));
      return;
    }
    stats.loadMs = performance.now() - t0;
    setStatus('model', 'ok', MODELS[modelKey] + ' loaded in ' + fmtMs(stats.loadMs));
    log('model', MODELS[modelKey] + ' loaded in ' + fmtMs(stats.loadMs));
    renderStats();
    startLoop();
  }

  // ---------- check loop ----------

  const stats = {
    loadMs: null, firstMs: null, lastMs: null, lastAt: null,
    sum: 0, n: 0, min: Infinity, max: 0, ok: 0, errors: 0
  };
  let loopStarted = false;
  let paused = false;
  let lastSummary = null;
  let brightness = null;
  let lowLight = false;
  let lastBoost = null;           // { lo, hi, gain } from Night boost's last levels stretch

  // Mean brightness (0–255) of the crop, read from a 64 px wide copy so it stays cheap.
  function readLight(cx, cy, cw, ch) {
    const w = 64, h = Math.max(1, Math.round(64 * ch / cw));
    if (luma.width !== w) luma.width = w;
    if (luma.height !== h) luma.height = h;
    lctx.drawImage(video, cx, cy, cw, ch, 0, 0, w, h);
    const d = lctx.getImageData(0, 0, w, h).data;
    let sum = 0;
    for (let j = 0; j < d.length; j += 4) sum += 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2];
    brightness = sum / (d.length / 4);
    if (!lowLight && brightness < LOW_LIGHT) {
      lowLight = true;
      log('light', 'Low light (brightness ' + Math.round(brightness) + ')');
    } else if (lowLight && brightness > NORMAL_LIGHT) {
      lowLight = false;
      log('light', 'Normal light (brightness ' + Math.round(brightness) + ')');
    }
  }

  // Lays the views out on the MOSAIC_PX square: one view fills it, more share
  // a grid (2×2 for up to four). Each view is scaled to fit its tile, keeping
  // its shape, so a small spot is enlarged. Positions are in mosaic pixels;
  // sx/sy/sw/sh is the view in video pixels and k the scale between them.
  function mosaicLayout(views, vw, vh) {
    const grid = Math.ceil(Math.sqrt(views.length));
    const tile = MOSAIC_PX / grid;
    return views.map((v, i) => {
      const sx = Math.round(v.x * vw), sy = Math.round(v.y * vh);
      const sw = Math.max(1, Math.round(v.w * vw)), sh = Math.max(1, Math.round(v.h * vh));
      const k = Math.min(tile / sw, tile / sh);
      return {
        sx: sx, sy: sy, sw: sw, sh: sh, k: k,
        tx: (i % grid) * tile, ty: Math.floor(i / grid) * tile,
        dw: Math.max(1, Math.round(sw * k)), dh: Math.max(1, Math.round(sh * k))
      };
    });
  }

  function drawMosaic(ctx, layout) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, MOSAIC_PX, MOSAIC_PX);
    layout.forEach((t) => ctx.drawImage(video, t.sx, t.sy, t.sw, t.sh, t.tx, t.ty, t.dw, t.dh));
  }

  // Runs the model over the mosaic in `frame` and returns detections in video
  // pixels. YOLOv8n takes the whole mosaic in one run; COCO-SSD shrinks its
  // input to 300 px, so it gets one run per view instead.
  async function detectViews(layout) {
    let found = [];                 // boxes in mosaic pixels
    if (modelKey === 'yolov8n') {
      found = await model.detect(frame, MAX_BOXES, cfg.minScore);
    } else {
      for (const t of layout) {
        if (tileCanvas.width !== t.dw) tileCanvas.width = t.dw;
        if (tileCanvas.height !== t.dh) tileCanvas.height = t.dh;
        tctx.drawImage(frame, t.tx, t.ty, t.dw, t.dh, 0, 0, t.dw, t.dh);
        const dets = await model.detect(tileCanvas, MAX_BOXES, cfg.minScore);
        dets.forEach((d) => found.push({ class: d.class, score: d.score, bbox: [d.bbox[0] + t.tx, d.bbox[1] + t.ty, d.bbox[2], d.bbox[3]] }));
      }
    }
    // Each box belongs to the view its centre falls in, is clipped to that
    // view, and is mapped back to video pixels.
    const out = [];
    found.forEach((d) => {
      const cx = d.bbox[0] + d.bbox[2] / 2, cy = d.bbox[1] + d.bbox[3] / 2;
      const t = layout.find((v) => cx >= v.tx && cx < v.tx + v.dw && cy >= v.ty && cy < v.ty + v.dh);
      if (!t) return;               // centred on padding
      const x0 = Math.max(d.bbox[0], t.tx), y0 = Math.max(d.bbox[1], t.ty);
      const x1 = Math.min(d.bbox[0] + d.bbox[2], t.tx + t.dw), y1 = Math.min(d.bbox[1] + d.bbox[3], t.ty + t.dh);
      out.push({
        class: d.class, score: d.score,
        bbox: [t.sx + (x0 - t.tx) / t.k, t.sy + (y0 - t.ty) / t.k, (x1 - x0) / t.k, (y1 - y0) / t.k]
      });
    });
    return dedupe(out);
  }

  // Views of neighbouring spots overlap, so one car can be found twice.
  function dedupe(dets) {
    const kept = [];
    dets.slice().sort((a, b) => b.score - a.score).forEach((d) => {
      if (!kept.some((k) => k.class === d.class && iou(k.bbox, d.bbox) > DUPLICATE_IOU)) kept.push(d);
    });
    return kept;
  }

  function iou(a, b) {
    const inter = overlapArea(a[0], a[1], a[2], a[3], b);
    return inter / (a[2] * a[3] + b[2] * b[3] - inter);
  }

  // Night boost: averages BOOST_FRAMES mosaics (the scene is still, so this
  // cuts sensor noise), then stretches the levels so the 1st–99th brightness
  // percentiles span 0–255, with the gain capped at BOOST_MAX_GAIN. Pixels
  // black in every frame (the mosaic's padding) are left out of the percentiles.
  async function boostFrame(layout, vw, vh) {
    const size = MOSAIC_PX;
    const n = size * size * 4;
    const sum = new Uint16Array(n);
    const gap = Math.max(34, 1000 / (cameraSettings().frameRate || fps));
    if (stack.width !== size) stack.width = size;
    if (stack.height !== size) stack.height = size;
    for (let f = 0; f < BOOST_FRAMES; f++) {
      if (f) await sleep(gap);
      if (video.videoWidth !== vw || video.videoHeight !== vh) throw new Error('Frame changed size during Night boost');
      drawMosaic(sctx, layout);
      const d = sctx.getImageData(0, 0, size, size).data;
      for (let j = 0; j < n; j++) sum[j] += d[j];
    }
    let px = 0;
    const hist = new Uint32Array(256);
    for (let j = 0; j < n; j += 4) {
      if (sum[j] + sum[j + 1] + sum[j + 2] === 0) continue;
      hist[Math.min(255, Math.floor((0.299 * sum[j] + 0.587 * sum[j + 1] + 0.114 * sum[j + 2]) / BOOST_FRAMES))]++;
      px++;
    }
    let lo = 0, hi = 255, acc = 0;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= px * 0.01) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= px * 0.01) { hi = v; break; } }
    const gain = Math.min(BOOST_MAX_GAIN, 255 / Math.max(1, hi - lo));
    const mul = gain / BOOST_FRAMES, off = lo * gain;
    const out = fctx.createImageData(size, size);
    const o = out.data;            // clamps to 0–255 on write
    for (let j = 0; j < n; j += 4) {
      o[j] = sum[j] * mul - off;
      o[j + 1] = sum[j + 1] * mul - off;
      o[j + 2] = sum[j + 2] * mul - off;
      o[j + 3] = 255;
    }
    fctx.putImageData(out, 0, 0);
    return { lo: lo, hi: hi, gain: gain };
  }

  function cameraLive() {
    return !!(track && track.readyState === 'live' && video.readyState >= 2 && video.videoWidth > 0);
  }

  function startLoop() {
    if (loopStarted || !model || !cameraLive()) return;
    loopStarted = true;
    setStatus('check', 'pending', 'First check (GPU warm-up can take a while)…');
    log('check', 'Loop started: every ' + cfg.interval + ' ms, minScore ' + cfg.minScore + ', one view per spot on a ' + MOSAIC_PX + ' px mosaic');
    runCheck();
  }

  async function runCheck() {
    const started = performance.now();
    if (!paused && cameraLive()) {
      await check();
      if (prevCheckStart !== null) {
        recentChecks.push([performance.now() - started, started - prevCheckStart]);
        if (recentChecks.length > 20) recentChecks.shift();
      }
      prevCheckStart = started;
    } else {
      prevCheckStart = null;
    }
    setTimeout(runCheck, Math.max(0, cfg.interval - (performance.now() - started)));
  }

  // Load stand-ins: Safari gives pages no CPU or GPU %.
  // Detector busy is the share of time spent inside checks over the last 20.
  const recentChecks = [];        // [ms, period since the previous check started]
  let prevCheckStart = null;
  function detectorBusy() {
    let ms = 0, period = 0;
    recentChecks.forEach((r) => { ms += r[0]; period += r[1]; });
    return period ? Math.min(100, Math.round(100 * ms / period)) : null;
  }

  // Main-thread load: a 100 ms timer fires late by however long the page's
  // thread was busy, so its total lateness over the last ~10 s approximates load.
  const beats = [];               // [gap, late] for the last 100 heartbeats
  let lastBeat = performance.now();
  setInterval(() => {
    const now = performance.now();
    const gap = now - lastBeat;
    lastBeat = now;
    if (gap > 5000) return;       // the page was hidden: a pause, not load
    beats.push([gap, Math.max(0, gap - HEARTBEAT_MS)]);
    if (beats.length > 100) beats.shift();
  }, HEARTBEAT_MS);
  function mainThreadLoad() {
    let late = 0, gap = 0;
    beats.forEach((b) => { gap += b[0]; late += b[1]; });
    return gap ? Math.min(100, Math.round(100 * late / gap)) : null;
  }

  function gpuMemory(mem) {
    if (!mem || mem.numBytesInGPU === undefined) return '–';
    return Math.round(mem.numBytesInGPU / 1e6) + ' MB in use' +
      (mem.numBytesInGPUAllocated !== undefined ? ' · ' + Math.round(mem.numBytesInGPUAllocated / 1e6) + ' MB allocated' : '');
  }

  async function check() {
    const t0 = performance.now();
    try {
      const vw = video.videoWidth, vh = video.videoHeight;
      const views = spotViews();
      const layout = mosaicLayout(views, vw, vh);
      if (frame.width !== MOSAIC_PX) frame.width = MOSAIC_PX;
      if (frame.height !== MOSAIC_PX) frame.height = MOSAIC_PX;
      const ux0 = Math.min.apply(null, views.map((v) => v.x)), uy0 = Math.min.apply(null, views.map((v) => v.y));
      const ux1 = Math.max.apply(null, views.map((v) => v.x + v.w)), uy1 = Math.max.apply(null, views.map((v) => v.y + v.h));
      readLight(Math.round(ux0 * vw), Math.round(uy0 * vh),
        Math.max(1, Math.round((ux1 - ux0) * vw)), Math.max(1, Math.round((uy1 - uy0) * vh)));
      lastBoost = nightBoost ? await boostFrame(layout, vw, vh) : null;
      if (!lastBoost) drawMosaic(fctx, layout);
      const found = await detectViews(layout);
      const ms = performance.now() - t0;

      // If the phone rotated while the detector ran, this check's boxes and readings are dropped.
      const rotated = video.videoWidth !== vw || video.videoHeight !== vh;
      const fullFrame = views.length === 1 && views[0].w === 1 && views[0].h === 1;
      lastDets = rotated ? [] : found;
      lastViews = rotated || fullFrame ? [] : views;
      if (!rotated) spots.forEach((s, i) => { if (isActive(s)) updateSpot(i, readSpot(s, lastDets)); });
      stats.lastMs = ms;
      stats.lastAt = new Date();
      stats.ok++;
      if (stats.firstMs === null) {
        stats.firstMs = ms;
        log('check', 'First check: ' + fmtMs(ms) + ' (includes GPU warm-up)');
      } else {
        stats.n++;
        stats.sum += ms;
        stats.min = Math.min(stats.min, ms);
        stats.max = Math.max(stats.max, ms);
      }
      setStatus('check', stats.errors ? 'warn' : 'ok',
        stats.ok + ' ok · ' + stats.errors + ' failed · avg ' + fmtMs(stats.n ? stats.sum / stats.n : stats.firstMs));

      const summary = summarize(lastDets);
      if (summary !== lastSummary) {
        log('detect', summary);
        lastSummary = summary;
      }
      drawOverlay();
      renderDetections();
      renderStats();
      renderSpotTable();
    } catch (e) {
      stats.errors++;
      setStatus('check', 'fail', stats.ok + ' ok · ' + stats.errors + ' failed · ' + errText(e));
      log('check', 'Failed: ' + errText(e));
    }
  }

  function summarize(dets) {
    if (!dets.length) return 'Nothing detected';
    const counts = {};
    dets.forEach((d) => { counts[d.class] = (counts[d.class] || 0) + 1; });
    return Object.keys(counts).sort().map((k) => counts[k] + ' ' + k).join(', ');
  }

  $('pause').addEventListener('click', () => {
    paused = !paused;
    $('pause').textContent = paused ? 'Resume detection' : 'Pause detection';
    log('check', paused ? 'Paused' : 'Resumed');
  });

  // ---------- render ----------

  function statRows() {
    const mem = backendInfo ? tf.memory() : null;
    const busy = detectorBusy(), main = mainThreadLoad();
    return [
      ['Model', MODELS[modelKey]],
      ['Backend', backendInfo || '–'],
      ['Camera', video.videoWidth ? video.videoWidth + '×' + video.videoHeight : '–'],
      ['Model load', fmtMs(stats.loadMs)],
      ['First check', fmtMs(stats.firstMs)],
      ['Last check', fmtMs(stats.lastMs) + (stats.lastAt ? ' at ' + clock(stats.lastAt) : '')],
      ['Average', stats.n ? fmtMs(stats.sum / stats.n) + ' over ' + stats.n + ' (first excluded)' : '–'],
      ['Min / max', stats.n ? fmtMs(stats.min) + ' / ' + fmtMs(stats.max) : '–'],
      ['Brightness', brightness === null ? '–' : Math.round(brightness) + '/255' + (lowLight ? ' · low light' : '')],
      ['Night boost', !nightBoost ? 'off' : lastBoost
        ? 'on · levels ' + lastBoost.lo + '–' + lastBoost.hi + ' · gain ×' + lastBoost.gain.toFixed(1) : 'on'],
      ['Tensors', mem ? String(mem.numTensors) : '–'],
      ['Detector busy', busy === null ? '–' : busy + '% of the time (last ' + recentChecks.length + ' checks)'],
      ['Main thread', main === null ? '–' : main + '% busy (last ~10 s)'],
      ['GPU memory', gpuMemory(mem)],
      ['Failed checks', String(stats.errors)]
    ];
  }

  function renderStats() {
    const dl = $('stats');
    dl.textContent = '';
    statRows().forEach(([k, v]) => {
      const dt = document.createElement('dt');
      const dd = document.createElement('dd');
      dt.textContent = k;
      dd.textContent = v;
      dl.appendChild(dt);
      dl.appendChild(dd);
    });
  }

  function renderDetections() {
    const tbody = $('detections');
    tbody.textContent = '';
    if (!lastDets.length) {
      tbody.innerHTML = '<tr><td colspan="3" class="muted">Nothing above ' + Math.round(cfg.minScore * 100) + '%</td></tr>';
      return;
    }
    lastDets.forEach((d) => {
      const tr = document.createElement('tr');
      const c = document.createElement('td');
      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = colorFor(d.class);
      c.appendChild(sw);
      c.appendChild(document.createTextNode(d.class));
      const s = document.createElement('td');
      s.className = 'num';
      s.textContent = Math.round(d.score * 100) + '%';
      const b = document.createElement('td');
      b.className = 'num';
      b.textContent = d.bbox.map((v) => Math.round(v)).join(', ');
      tr.appendChild(c);
      tr.appendChild(s);
      tr.appendChild(b);
      tbody.appendChild(tr);
    });
  }

  renderStats();

  // ---------- visibility ----------

  let hiddenAt = null;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      hiddenAt = Date.now();
      log('page', 'Hidden');
      return;
    }
    log('page', 'Visible again' + (hiddenAt ? ' after ' + Math.round((Date.now() - hiddenAt) / 1000) + ' s' : ''));
    hiddenAt = null;
    if (stream && video.paused) video.play().catch((e) => log('camera', 'Resume failed: ' + errText(e)));
  });

  // ---------- report ----------

  // Leaves out the topic names: anyone who knows a topic can read it.
  function buildReport() {
    const lines = [];
    lines.push('Spot Watch report · ' + SW_BUILD);
    lines.push('Time: ' + new Date().toString());
    lines.push(platform());
    lines.push('UA: ' + navigator.userAgent);
    lines.push('Secure context: ' + window.isSecureContext + ' · localStorage: ' + (storageOk ? 'ok' : 'failing'));
    lines.push('');
    lines.push('Status:');
    STAGES.forEach(([key, label]) => {
      const s = statusEls[key];
      lines.push('  ' + label + ': ' + s.state + (s.detail ? ' · ' + s.detail : ''));
    });
    lines.push('');
    lines.push('Checks:');
    statRows().forEach(([k, v]) => lines.push('  ' + k + ': ' + v));
    lines.push('  Camera settings: ' + JSON.stringify(cameraSettings()) + ' · asked for ' + fps + ' fps, ' + aspect);
    lines.push('  Camera capabilities: ' + JSON.stringify(cameraCapabilities()));
    lines.push('  Last detections: ' + (stats.ok ? summarize(lastDets) : 'none yet'));
    lines.push('');
    lines.push('Spots (frame ' + (video.videoWidth ? video.videoWidth + '×' + video.videoHeight + ' ' + frameShape() : 'off') +
      ' · window ' + window.innerWidth + '×' + window.innerHeight + ' · debug boxes ' + (debugBoxes ? 'on' : 'off') + '):');
    spots.forEach((s, i) => {
      const t = tracks[i];
      lines.push('  Spot ' + (i + 1) + ': ' + (!s ? 'not set' : describeSpot(s) + ' · ' + t.state +
        (t.since ? ' since ' + clock(t.since) : '') +
        (t.coverage !== null ? ' · coverage ' + Math.round(t.coverage * 100) + '% · person ' + (t.person ? 'yes' : 'no') : '') +
        ' · next ' + runText(t)));
    });
    lines.push('  Views: ' + (lastViews.length
      ? lastViews.map((v) => 'x ' + pct(v.x) + ', y ' + pct(v.y) + ', w ' + pct(v.w) + ', h ' + pct(v.h)).join(' | ')
      : 'full frame'));
    lines.push('Settings: ' + SETTINGS.map((s) => s.key + ' ' + cfg[s.key]).join(', '));
    lines.push('');
    lines.push('Events (' + eventRows.length + ' rows, newest first, last ' + EVENTS_SHOWN + '):');
    eventRows.slice(-EVENTS_SHOWN).reverse().forEach((r) => lines.push('  ' + stamp(new Date(r[0])) + '  ' + eventText(r)));
    lines.push('');
    lines.push('Control topic: ' + messages.length + ' message(s) received, ' + reconnects + ' reconnect(s), last keepalive ' +
      (lastKeepalive ? clock(lastKeepalive) : 'none'));
    messages.forEach((m) => lines.push('  ' + clock(m.at) + (m.lagS !== null ? ' (~' + m.lagS + ' s)' : '') + ': ' + m.text.slice(0, 80)));
    lines.push('');
    lines.push('Errors (' + SW_errors.length + '):');
    SW_errors.forEach((e) => lines.push('  ' + e.time + ' ' + e.msg));
    lines.push('');
    lines.push('Log (newest first):');
    logEntries.slice().reverse().forEach((e) => lines.push('  ' + logLine(e)));
    return lines.join('\n');
  }

  $('copyReport').addEventListener('click', () => {
    const text = buildReport();
    const box = $('reportBox');
    box.value = text;
    const fallback = (why) => {
      box.hidden = false;
      box.focus();
      box.setSelectionRange(0, text.length);
      $('copyResult').textContent = 'Could not copy (' + why + '). Select the text below and copy it.';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        box.hidden = true;
        $('copyResult').textContent = 'Report copied at ' + clock() + '.';
      }, (e) => fallback(errText(e)));
    } else {
      fallback('clipboard API missing');
    }
  });

  // ---------- start ----------

  log('page', 'Loaded ' + SW_BUILD + ' · ' + platform());
  initDetector().catch((e) => log('detector', 'Unexpected: ' + errText(e)));
})();
</script>
</body>
</html>
